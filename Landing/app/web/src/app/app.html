@if (!loaded() && !settings().loadingText && !settings().loadingImageUrl) {
  <!-- No admin-configured loading screen and nothing cached from a previous
       visit yet — skip the overlay rather than flashing an empty box. -->
} @else if (!loaded()) {
  <div class="boot-loading">
    @if (settings().loadingImageUrl) {
      <img [src]="settings().loadingImageUrl" alt="" />
    }
    @if (settings().loadingText) {
      <p>{{ settings().loadingText }}</p>
    }
  </div>
}

<router-outlet />
